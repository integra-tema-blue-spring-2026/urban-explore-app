<div style="max-width: 900px; margin: 40px auto; padding: 0 20px; font-family: sans-serif;">

  <h2 style="margin-bottom: 24px; font-size: 22px;">Points of Interest</h2>

  <form [formGroup]="poiForm" (ngSubmit)="savePoi()"
  style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 32px;">
  <input formControlName="name" placeholder="Name"
    style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; flex: 1; min-width: 120px;">
  <input formControlName="description" placeholder="Description"
    style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; flex: 1; min-width: 120px;">
  <input formControlName="address" placeholder="Address"
    style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; flex: 1; min-width: 120px;">
  <input formControlName="type" placeholder="Type"
    style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; flex: 1; min-width: 100px;">
  <input formControlName="cityId" placeholder="City UUID"
    style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; flex: 1; min-width: 140px;">
  <button type="submit" [disabled]="!poiForm.valid"
    style="padding: 8px 20px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer;">
    {{ editingId ? 'Update POI' : 'Save POI' }}
  </button>
  <button *ngIf="editingId" type="button" (click)="cancelEdit()"
    style="padding: 8px 20px; background: #6b7280; color: white; border: none; border-radius: 6px; cursor: pointer;">
    Cancel
  </button>
</form>

  <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
    <thead>
      <tr style="background: #f1f5f9; text-align: left;">
        <th style="padding: 10px 14px; border-bottom: 2px solid #e2e8f0;">Name</th>
        <th style="padding: 10px 14px; border-bottom: 2px solid #e2e8f0;">Description</th>
        <th style="padding: 10px 14px; border-bottom: 2px solid #e2e8f0;">Address</th>
        <th style="padding: 10px 14px; border-bottom: 2px solid #e2e8f0;">Type</th>
        <th style="padding: 10px 14px; border-bottom: 2px solid #e2e8f0;">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let poi of pois" style="border-bottom: 1px solid #e2e8f0;">
        <td style="padding: 10px 14px;">{{ poi.name }}</td>
        <td style="padding: 10px 14px;">{{ poi.description }}</td>
        <td style="padding: 10px 14px;">{{ poi.address }}</td>
        <td style="padding: 10px 14px;">{{ poi.type }}</td>
        <td style="padding: 10px 14px; display: flex; gap: 6px;">
          <button (click)="startEdit(poi)"
            style="padding: 5px 12px; background: #f59e00; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Edit
          </button>
          <button (click)="onDelete(poi.id!)"
            style="padding: 5px 12px; background: #ef4444; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Delete
          </button>
        </td>

      </tr>
    </tbody>
  </table>

</div>
