<div style="max-width: 900px; margin: 40px auto; padding: 0 20px; font-family: sans-serif;">

  <h2 style="margin-bottom: 4px; font-size: 22px;">Points of Interest</h2>
  <p style="color: #6b7280; margin-bottom: 24px; font-size: 14px;">{{ pois.length }} locations</p>

  <form [formGroup]="poiForm" (ngSubmit)="savePoi()"
    style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 32px;">
    <input formControlName="name" placeholder="Name"
      style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; flex: 1; min-width: 120px;">
    <input formControlName="description" placeholder="Description"
      style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; flex: 1; min-width: 120px;">
    <input formControlName="address" placeholder="Address"
      style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; flex: 1; min-width: 120px;">
    <input formControlName="type" placeholder="Type"
      style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; flex: 1; min-width: 100px;">
    <input formControlName="cityId" placeholder="City UUID"
      style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; flex: 1; min-width: 140px;">
    <button type="submit" [disabled]="!poiForm.valid"
      style="padding: 8px 20px; background: #7c3aed; color: white; border: none; border-radius: 6px; cursor: pointer;">
      {{ editingId ? 'Update POI' : 'Add new point' }}
    </button>
    <button *ngIf="editingId" type="button" (click)="cancelEdit()"
      style="padding: 8px 20px; background: #6b7280; color: white; border: none; border-radius: 6px; cursor: pointer;">
      Cancel
    </button>
  </form>

  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px;">
    <div *ngFor="let poi of pois"
      style="border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.06); position: relative;">

      <!-- Action buttons overlay -->
      <div style="position: absolute; top: 8px; right: 8px; display: flex; gap: 4px;">
        <button (click)="onDelete(poi.id!)"
          style="padding: 4px 8px; background: rgba(255,255,255,0.9); border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">
          🗑️
        </button>
      </div>

      <div style="height: 120px; background: linear-gradient(135deg, #e0e7ff, #c7d2fe); display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 36px;">📍</span>
      </div>

      <div style="padding: 12px;">
        <p style="font-weight: 600; font-size: 15px; margin: 0 0 4px 0;">{{ poi.name }}</p>
        <a [routerLink]="['/poi/details', poi.id]" style="font-size: 12px; color: #7c3aed; text-decoration: none;">
          View Details and Reviews →
        </a>
        <p style="font-size: 12px; color: #6b7280; margin: 4px 0 0 0;">{{ poi.address }}</p>
        <p style="font-size: 12px; color: #6b7280; margin: 2px 0 0 0;">{{ poi.type }}</p>
      </div>

    </div>
  </div>
</div>
