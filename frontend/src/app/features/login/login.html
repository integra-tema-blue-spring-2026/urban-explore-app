<div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
  <h1 class="font-bold text-xl">Welcome back</h1>
  <h2>Enter your credentials to access your account</h2>
  <form [formGroup]="loginForm" (ngSubmit)="login()" class="flex flex-col gap-4 mt-4">
    <input
      pInputText
      type="text"
      formControlName="username"
      placeholder="Username"
      class="w-full"
    />
    <input
      pInputText
      type="password"
      formControlName="password"
      placeholder="Password"
      class="w-full"
    />
    <button
      pButton
      type="submit"
      [disabled]="!loginForm.valid"
      class="w-full bg-[#675EC2]! border-[#675EC2]! text-white!"
    >
      <span pButtonLabel>Login</span>
    </button>
  </form>
</div>
